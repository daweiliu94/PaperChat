<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PaperChat Reader</title><link rel="stylesheet" href="pdf_viewer.css"><style>
html,body{margin:0;height:100%;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#233d32;background:#edf0ed}*{box-sizing:border-box}button,input{font:inherit}button{padding:6px 9px;background:white;border:1px solid #c5d0c7;border-radius:6px;color:#234a3d;cursor:pointer}#app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100vh}#reading{min-width:0;display:flex;flex-direction:column;height:100vh}#toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 12px;background:#fff;border-bottom:1px solid #ced8cf}#url{flex:1;min-width:150px;padding:6px;border:1px solid #c5d0c7;border-radius:6px}#file{display:none}#page{width:50px;padding:5px;border:1px solid #c5d0c7;border-radius:5px}#search{width:100px;padding:5px;border:1px solid #c5d0c7;border-radius:5px}#status{padding:8px 12px;background:#f7faf5;font-size:12px;min-height:32px}#pages{overflow:auto;flex:1;min-height:0;padding:20px;overscroll-behavior:contain}#empty{padding:60px 30px;text-align:center;color:#5a7063}.page-wrap{position:relative;margin:0 auto 22px;box-shadow:0 2px 12px #172a1c22;background:white;max-width:none}.page-wrap canvas{display:block}.page-wrap .textLayer{z-index:2}.page-label{text-align:center;margin:0 0 12px;color:#587063;font-size:12px}#chat-host{height:100vh;min-width:0}#divider{position:fixed;top:0;bottom:0;right:397px;width:7px;cursor:col-resize;z-index:10}#show-chat{display:none}@media(prefers-color-scheme:dark){html,body{background:#263129;color:#e3ece4}#toolbar,#status{background:#1c2b21;border-color:#3b5041}button,input{color:#e3ece4;background:#2d4434;border-color:#465e4d}#empty,.page-label{color:#a8bba9}}
</style></head><body><div id="app"><section id="reading"><header id="toolbar"><input id="url" aria-label="PDF source URL" placeholder="PDF source URL"><button id="load">Load URL</button><button id="open">Open local PDF</button><input id="file" type="file" accept="application/pdf,.pdf"><button id="previous" aria-label="Previous page">‹</button><input id="page" type="number" min="1" value="1" aria-label="Page number"><span id="count">/ —</span><button id="next" aria-label="Next page">›</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button><input id="search" placeholder="Find in paper" aria-label="Search paper text"><button id="find">Find</button><button id="show-chat">Open chat</button></header><div id="status">Load a PDF from its source link or select a local file. No PDF copy will be saved.</div><main id="pages"><div id="empty"><h1>Read and ask, side by side</h1><p>Open a paper to start. Its text and figures stay in memory.</p></div></main></section><aside id="chat-host"></aside></div><div id="divider"></div><script src="reader.js"></script></body></html>
